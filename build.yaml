# GitHub Actions build matrix for the ZMK keyboard in this repo.
# The wired Lulu (QMK) is built separately: see qmk.json and
# .github/workflows/build-qmk.yml.
---
include:
  # Boardsource Wireless Lily58 SMT (BLE Lulu)
  # nice!view: uncomment `shield: nice_view` on both halves and
  # CONFIG_ZMK_DISPLAY=y in config/blelulu.conf.
  - board: blelulu_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    # shield: nice_view
    artifact-name: blelulu_left
  - board: blelulu_right
    # shield: nice_view
    artifact-name: blelulu_right

  # Settings reset firmware: clears Bluetooth pairings, including the bond
  # between the two halves. Uncomment both, flash them, then reflash the
  # normal firmware.
  # - board: blelulu_left
  #   shield: settings_reset
  #   artifact-name: blelulu_left_settings_reset
  # - board: blelulu_right
  #   shield: settings_reset
  #   artifact-name: blelulu_right_settings_reset
