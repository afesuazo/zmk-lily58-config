# Boardsource Wireless Lily58 SMT ("BLE Lulu")
# Board defaults (USB, BLE, ZMK Studio on the left half, sleep) are in
# boards/boardsource/blelulu/.

# nice!view displays: not installed yet. To turn them on:
#   1. uncomment CONFIG_ZMK_DISPLAY below
#   2. uncomment `shield: nice_view` on both entries in build.yaml
# The 180-degree rotation is already set in boards/boardsource/blelulu/blelulu.conf
# and needs the invrtd/zmk fork that config/west.yml pins.
# CONFIG_ZMK_DISPLAY=y

# Milliseconds of inactivity before entering idle state (1 hour)
CONFIG_ZMK_IDLE_TIMEOUT=3600000
# Milliseconds of inactivity before entering deep sleep (2 hours)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=7200000

# Mouse keys on the NAV layer (they work on the Lulu too)
CONFIG_ZMK_POINTING=y
